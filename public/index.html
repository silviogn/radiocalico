<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Calico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- Nav -->
  <nav>
    <div class="nav-logo-wrap">
      <img src="/RadioCalicoLogoTM.png" alt="Radio Calico logo" />
    </div>
    <span class="nav-wordmark">Radio Calico</span>
  </nav>

  <!-- Main content -->
  <div class="page">

    <!-- Player card -->
    <div class="player-card">

      <!-- Album art + track info -->
      <div class="card-top">
        <div class="album-art-wrap" id="albumArtWrap">
          <div class="album-art-placeholder" id="albumArtPlaceholder">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
          </div>
          <img id="albumArt" style="display:none" alt="Album art" />
        </div>

        <div class="track-info">
          <span class="track-artist" id="npArtist">—</span>
          <span class="track-title"  id="npTitle">—</span>
          <span class="track-album"  id="npAlbum"></span>

          <div class="quality-block">
            <span class="quality-line" id="qualitySource"></span>
            <span class="quality-line" id="qualityStream"></span>
          </div>

          <span class="rate-label">Rate this track</span>
          <div class="rating-row">
            <button class="btn-rate" id="btnUp" aria-label="Thumbs up">
              👍 <span id="countUp">0</span>
            </button>
            <button class="btn-rate" id="btnDown" aria-label="Thumbs down">
              👎 <span id="countDown">0</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Controls bar -->
      <div class="controls-bar">
        <button class="btn-play" id="playBtn" aria-label="Play / Pause">
          <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <span class="elapsed" id="elapsed">0:00</span>

        <span class="status-text">
          <span class="status-dot loading" id="statusDot"></span><span id="statusText">Connecting…</span>
        </span>

        <div class="volume-row">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.02" value="1" aria-label="Volume" />
        </div>
      </div>

    </div><!-- /.player-card -->

    <!-- Previous tracks -->
    <div class="prev-section">
      <h2>Previous tracks:</h2>
      <ul class="recent-list" id="recentList"></ul>
    </div>

  </div><!-- /.page -->

  <!-- Hidden audio -->
  <audio id="audio" preload="none"></audio>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Radio Calico &nbsp;·&nbsp; Streaming lossless music you'll love</p>
  </footer>

  <script type="module" src="/public/js/app.js"></script>

</body>
</html>
